name: Documentation

on:
  push:
    branches:
      - main
  # Validation (incl. the llms.txt drift check) and a trial build on PRs,
  # so problems surface before merge rather than after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Validate that every docs page conforms to the Open Knowledge Format (OKF v0.2)
  okf-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      # The validator and llms.txt generator need only PyYAML; the server package is not
      # installed until build step 2 adds the config and tool reference generators.
      - run: pip install "zensical>=0.0.60" pyyaml
      - run: python scripts/okf_validate.py docs
      # Fail if a generated file drifted from its sources.
      - run: |
          python scripts/gen_llms_txt.py
          git diff --exit-code docs/llms.txt docs/llms-full.txt
      # Trial build on every run, so a broken link fails the PR, not the deploy.
      - run: zensical build --clean --strict

  deploy:
    needs: okf-conformance
    # GitHub Pages is not available for private repositories on the free plan, so the
    # site deploys only once the repository is public.
    if: github.event_name != 'pull_request' && !github.event.repository.private
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install "zensical>=0.0.60" pyyaml
      - run: zensical build --clean --strict
      # Agent surface: markdown mirror, OKF meta injection, robots.txt
      - run: python scripts/postbuild_agent_surface.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
